name: Deploy Module Federation Apps

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8.15.4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Build products app
              working-directory: apps/products
              env:
                  NODE_ENV: production
                  # Update these URLs to match your deployment URLs
                  # For GitHub Pages: https://<username>.github.io/<repo>/products/
                  # For Vercel/Netlify: your production domain
                  PRODUCTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/products/
              run: pnpm build

            - name: Build container app
              working-directory: apps/container
              env:
                  NODE_ENV: production
                  # Update these URLs to match your deployment URLs
                  CONTAINER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
                  PRODUCTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/products/
              run: pnpm build

            - name: Prepare deployment directory
              run: |
                  mkdir -p deploy
                  cp -r apps/container/dist/* deploy/
                  mkdir -p deploy/products
                  cp -r apps/products/dist/* deploy/products/

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./deploy
                  # Optional: keep old versions
                  # keep_files: true
